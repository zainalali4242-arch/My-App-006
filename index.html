<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16191D">
<title>Log Mekanik</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-inner">
    <div class="brand">
      <div class="brand-mark">LM</div>
      <div>
        <div class="brand-name">Log Mekanik</div>
        <div class="brand-sub">Catatan aktivitas harian</div>
      </div>
    </div>
    <p class="gate-note">Masukkan User ID dari lembar akun Anda.</p>
    <div id="gate-users" class="gate-users"></div>
    <button id="gate-manage" class="btn btn-ghost btn-block">Kelola daftar mekanik</button>
    <div class="gate-foot">Data tersimpan di perangkat ini. Belum ada server.</div>
  </div>
</div>

<header id="topbar" class="topbar hidden">
  <div class="topbar-left">
    <div class="topbar-title" id="topbar-title">Beranda</div>
    <div class="topbar-sub" id="topbar-sub"></div>
  </div>
  <button class="icon-btn" id="btn-settings" aria-label="Pengaturan">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main id="view" class="view hidden"></main>

<nav id="tabbar" class="tabbar hidden">
  <button class="tab" data-route="beranda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span>Beranda</span>
  </button>
  <button class="tab" data-route="riwayat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Riwayat</span>
  </button>
  <button class="tab tab-primary" data-route="catat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
    <span>Catat</span>
  </button>
  <button class="tab" data-route="unit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="8" width="13" height="8" rx="1.5"/><path d="M16 11h3l2 3v2h-5z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
    <span>Unit</span>
  </button>
  <button class="tab" data-route="laporan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h4"/></svg>
    <span>Laporan</span>
  </button>
</nav>

<div id="sheet" class="sheet hidden">
  <div class="sheet-scrim" data-close="1"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <div class="sheet-title" id="sheet-title"></div>
      <button class="icon-btn" data-close="1" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="busy" class="busy hidden"><div class="busy-box"><div class="spinner"></div><span id="busy-text">Memproses…</span></div></div>

<input type="file" id="file-gallery" accept="image/*" multiple hidden>
<input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="file-csv" accept=".csv,text/csv" hidden>
<input type="file" id="file-json" accept=".json,application/json" hidden>

<script src="lib/dexie.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="lib/xlsx.mini.min.js"></script>
<script src="js/util.js"></script>
<script src="js/master-data.js"></script>
<script src="js/db.js"></script>
<script src="js/photos.js"></script>
<script src="js/report.js"></script>
<script src="js/screens.js"></script>
<script src="js/screens-admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
